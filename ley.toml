# The ledger for this repository: what its words mean, what its rules are, and where things are.
# `ley show` lists the names. `ley show <name>` prints the rows. `ley check` runs the commands.
row = [
  # ---- the words
  { name = "ledger", is = "a file named ley.toml that holds facts about the place it sits in, one row per line", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }, { by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "ledger", run = "ast-grep outline --type function --match '^parse$' --view signatures src", shows = "the function that reads a ledger and reports every rule it breaks", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "row", is = "one fact about one place: what a thing is, or a command that shows it, or both", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }, { by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "row", run = "ast-grep outline --type struct --match '^Row$' --view expanded src", shows = "the fields of a row once it is read", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "row", run = "rg -n -F 'pub const KEYS' src", shows = "the line where the keys a row may carry are listed", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "definition", is = "the part of a row that says what a thing is, with the sources who said so", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "source", is = "who said a definition, and on what date", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "pointer", is = "the part of a row that holds a command and says what the command shows", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "pointer", run = "ast-grep outline --type struct --match '^Pointer$' --view expanded src", shows = "the fields of a pointer", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "result", is = "one thing a command shows: a line for rg, a match or a symbol for ast-grep", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "shape", is = "a program and the flags a row may pass to it; `ley check` runs only commands that fit a shape", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }, { by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "shape", run = "rg -n '^program' src/shapes.toml", shows = "the program of each shape", count = 4, since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "shape", run = "ast-grep outline --type function --match '^plan$' --view signatures src", shows = "the function that fits a command to a shape, or says why it fits none", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "words", run = "ast-grep outline --type function --match '^split$' --view signatures src", shows = "the function that splits a command into words without starting a shell", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "status", is = "what became of a row's command when it was checked: holds, differs, restates, could not run, or not checked", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "status", run = "ast-grep outline --type enum --match '^Status$' --view expanded src", shows = "the states a checked row can end in", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "sentence", run = "ast-grep outline --type function --match '^sentences$' --view signatures src", shows = "the function that writes a row as sentences", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "since", is = "the earliest date at which a row's command is known to have shown what the row says", said = [{ by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "since", run = "ast-grep outline --type function --match '^since$' --view signatures src", shows = "the function that walks back through history to find that date", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "rule", is = "something every ledger must follow; `ley` refuses to read a ledger that breaks one", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "rule", run = "rg -n -F 'pub const RULES' src", shows = "the line where the list of rule names starts", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "rule", run = "ast-grep outline --type function --match '^rules$' --view signatures src", shows = "the function that reads the rules out of this ledger, for `ley rules`", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "fixture", is = "a small ledger or command, kept in fixtures, that follows a rule or breaks it and says why", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "example", run = "rg --files -g ley.toml examples", shows = "the ledger of each example", since = 2026-11-10, sha = "e51337a717b4" },

  # ---- the rules
  { name = "show, do not state", is = "the rule that a row gives a command that shows the thing, and says only what kind of thing the command shows", said = [{ by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "show, do not state", run = "ast-grep outline --type function --match '^restated$' --view signatures src", shows = "the function that finds text in a row that its own command printed", since = 2026-11-10, sha = "e605d06fb4f4" },
  { name = "no stored output", is = "the rule that nothing a command printed is kept in a row: no value, no file position, no line number, no matched text", said = [{ by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "no stored output", run = "rg -l -F '# breaks: stored-output' fixtures/invalid", shows = "the broken ledgers that show what this rule refuses", count = 2, since = 2026-11-10, sha = "e51337a717b4" },
  { name = "a command or a source", is = "the rule that every sentence in a ledger is either what a command shows or what a named source said on a date", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "a command or a source", run = "rg -l -F '# breaks: source' fixtures/invalid", shows = "the broken ledgers that show what this rule refuses", count = 4, since = 2026-11-10, sha = "e51337a717b4" },
  { name = "no grades", is = "the rule that a ledger records who said a thing and when, and assigns no level of trust", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "no instructions", is = "the rule that a row states a fact and leaves the reader to decide whether to run anything", said = [{ by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "one row per line", is = "the rule that each row is one line of the file, so one search returns the whole row", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }, { by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "one row per line", run = "rg -l -F '# breaks: one-line' fixtures/invalid", shows = "the broken ledgers that show what this rule refuses", count = 4, since = 2026-11-10, sha = "e51337a717b4" },
  { name = "the same for every reader", is = "the rule that a command has no shell syntax and only relative paths, so it shows every reader the same thing", said = [{ by = "Claude Fable 5.2", on = 2026-11-10 }] },
  { name = "the same for every reader", run = "rg -n -F 'a command that would not mean the same thing' fixtures/commands.toml", shows = "where the commands refused under this rule start", since = 2026-11-10, sha = "e51337a717b4" },
  { name = "exact name, wide search", is = "the rule that a command names the thing exactly and searches as much of the place as it can, so it still finds the thing after a file moves", said = [{ by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "fail loud", is = "the rule that a row which could not be run is reported as such, and never passed over", said = [{ by = "Corey Vixie", on = 2026-11-10 }] },
  { name = "earliest known", is = "the rule that a recorded date is the earliest at which the row is known to have held, and moves earlier as more history is read", said = [{ by = "Corey Vixie", on = 2026-11-10 }] },
]
