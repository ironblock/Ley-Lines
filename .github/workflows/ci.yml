name: ci

# A push to a branch that has a pull request would otherwise run everything twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every program is installed at a fixed version. So a build fails because
      # this repository changed, and not because a newer program came out.
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.97.0

      - name: Install the programs that rows name
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/ripgrep.deb" \
            https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep_14.1.0-1_amd64.deb
          echo "78953d5a1c97cb363de0098ff73a7ef33fcae014abd4d62f0da490fe3f58ee94  $RUNNER_TEMP/ripgrep.deb" | sha256sum --check
          sudo dpkg --install "$RUNNER_TEMP/ripgrep.deb"
          npm install --global @ast-grep/cli@0.51.1
          rg --version
          ast-grep --version

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
        env:
          # A test that cannot find rg, ast-grep or git fails instead of skipping.
          LEY_TEST_REQUIRE_TOOLS: "1"

      - name: Check this repository's own ledger
        run: cargo run --locked --quiet -- check --strict

      - name: Check the example's ledger
        run: cargo run --locked --quiet -- --ledger examples/pipeline/ley.toml check --strict

      # Last, so that the steps above do not build twice.
      - name: Build with the oldest Rust the README names
        run: cargo +1.85.0 build --locked
